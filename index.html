<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar</title>
</head>
<body>
    <h1>Sistemas de Multas</h1>
    Velocidade: <input type="number" name="txtvel" id="txtvel"> km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res"></div>
    <!-- observe q foi adicionado o evento pelo html vinculadas as funcoes -->
 <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">Interaja</div>

 <style>
    div#area {
    font: normal 18pt Arial;
    background: aqua;
    width: 200px;
    height: 200px;
    line-height:200px;
    text-align:center;
    }
    input {
    font: normal 13pt Arial;
    width: 100px;
    }
    
   
 </style>
<script>
    function calcular() {
        var txtv = window.document.querySelector('input#txtvel')
        var res = document.querySelector('div#res')
        var vel = Number(txtv.value)
        res.innerHTML = `<p> Sua Velocidade atual e de <strong>${vel}km/h</strong> </p>`
        if (vel > 60) {
            res.innerHTML += `<p> voce estar multado por excesso de velocidade.</p>`
        }
        res.innerHTML += `<p>Dirija sempre com o cinto de seguranca!</p>`
              
        
    }
    // eventos do javaScript
    //a.addEventListener('click', clicar)
    //a.addEventListener('mouseenter', entrar)
    //a.addEventListener('mouseout', sair)
    function clicar() {
        var a = document.getElementById('area')
        a.innerText = 'Clicou'
        a.style.background = 'red'
    }
    function entrar(){
        var a = document.getElementById('area')
        a.innerText = 'Entrou'
    }
    function sair(){
        var a = document.getElementById('area')
        a.innerText = 'saiu'
        a.style.background = 'aqua'

    }

    


</script>
</body>
</html>
